name: Build & Release APK + Web

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'https://backend-production-e561.up.railway.app/api' }} \
            --dart-define=SOCKET_URL=${{ secrets.SOCKET_URL || 'https://backend-production-e561.up.railway.app' }}

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
        env:
          JAVA_OPTS: "-Xmx4g"

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: kerja-serabutan-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release & upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Kerja Serabutan ${{ github.ref_name }}"
          body: |
            ## Kerja Serabutan ${{ github.ref_name }}

            ### Cara Install
            1. Download file `kerja-serabutan-${{ github.ref_name }}.apk`
            2. Aktifkan **Install dari sumber tidak dikenal** di pengaturan Android
            3. Buka file APK dan install

            ### Fitur
            - Register/Login akun
            - Peta pekerja & tugas terdekat
            - Post & lamar tugas serabutan
            - Real-time chat + nego harga
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy-landing:
    name: Deploy Landing Page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy docs/ to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          publish_branch: gh-pages
